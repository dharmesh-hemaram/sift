<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sift</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="app">
      <aside id="rail">
        <div id="rail-header">
          <span>Captured responses</span>
          <span id="rail-count">0</span>
          <button id="combine-toggle-btn" title="Combine multiple responses">Combine &#8908;</button>
          <button id="clear-btn" title="Clear captured responses">Clear</button>
        </div>
        <ul id="rail-list"></ul>
      </aside>
      <main id="main">
        <div id="empty-state">Reload the inspected page — captured JSON responses will appear on the left.</div>
      </main>
      <!-- #main's content is fully replaced by panel.js's render(); the
           markup above is just the pre-JS placeholder. -->
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
