<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sift</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="app">
      <aside id="rail">
        <div id="rail-header">
          <span>Responses</span>
          <span id="rail-count">0</span>
          <button
            id="clear-btn"
            class="icon-btn"
            title="Clear captured responses"
            aria-label="Clear captured responses"
          >
            &#128465;
          </button>
        </div>
        <ul id="rail-list"></ul>
        <footer id="rail-footer">
          <div id="settings-dropdown">
            <button
              id="settings-btn"
              class="icon-btn"
              title="Settings"
              aria-label="Settings"
              aria-haspopup="true"
              aria-expanded="false"
            >
              &#9881;
            </button>
            <div id="settings-menu" hidden>
              <button id="manage-toggle-btn" type="button">Manage</button>
            </div>
          </div>
        </footer>
      </aside>
      <main id="main">
        <div id="empty-state">Reload the inspected page — captured JSON responses will appear on the left.</div>
      </main>
      <!-- #main's content is fully replaced by panel.js's render(); the
           markup above is just the pre-JS placeholder. -->
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
